lab:
  description: Sprint 4 - one Cisco IOSv router (R1) serving three subnets with DHCP
    and authoritative DNS for server.kaanta.edu
  notes: |-
    Subnet A 192.168.10.0/24: bk-Client1 (DHCP CLIENT1_POOL), gateway and DNS 192.168.10.1
    Subnet B 192.168.11.0/24: bk-Client2 (DHCP CLIENT2_POOL), gateway and DNS 192.168.11.1
    Subnet C 192.168.20.0/24: bk-Server static 192.168.20.100, gateway 192.168.20.1
    DNS on R1: server.kaanta.edu -> 192.168.20.100
    Console login for the Alpine nodes: cisco / cisco
  title: CS 457 Pente - Sprint 4 one-router topology
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
