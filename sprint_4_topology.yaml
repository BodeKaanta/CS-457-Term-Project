          # CML runs this shell script as root when the Alpine node boots.
          hostname bk-Client1
          # Console login
          USERNAME=cisco
          PASSWORD=cisco
          # Bring the link up. The IP address, gateway and DNS server come from R1's
          # DHCP pool (CLIENT1_POOL): run "sudo udhcpc -i eth0" at the console (Sprint 4 2.3).
          ip link set eth0 up
