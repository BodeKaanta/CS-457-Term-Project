! =====================================================================
! Router R1 (CML node bk-R1): gateway, DHCP server, and DNS server
! CS 457 Term Project, Sprint 4 (1-router topology)
!
! Gi0/1  192.168.10.1/24  Subnet A  bk-Client1  (DHCP pool CLIENT1_POOL)
! Gi0/2  192.168.11.1/24  Subnet B  bk-Client2  (DHCP pool CLIENT2_POOL)
! Gi0/3  192.168.20.1/24  Subnet C  bk-Server   (static 192.168.20.100)
!
! To apply by hand: at the R1 console type "enable", then
! "configure terminal", paste everything between the two cut lines, then
! "end" and "write memory". The same config is built into
! cml/pente_lab_import.yaml, so an imported lab boots with it.
! =====================================================================
! ---------------------------- cut here ----------------------------
hostname R1
!
! IPv4 forwarding between the three connected subnets (Sprint 4 §2.1).
! All three networks are directly connected, so no static routes are needed.
ip routing
!
! ---- Interfaces (Sprint 4 §2.1) ----
interface GigabitEthernet0/0
 description unused
 no ip address
 shutdown
!
interface GigabitEthernet0/1
 description Subnet A gateway - bk-Client1
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description Subnet B gateway - bk-Client2
 ip address 192.168.11.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/3
 description Subnet C gateway - bk-Server (game server)
 ip address 192.168.20.1 255.255.255.0
 no shutdown
!
! ---- DHCP (Sprint 4 §2.3) ----
! Never lease the gateway addresses. Client 1 gets 192.168.10.2, Client 2 192.168.11.2.
ip dhcp excluded-address 192.168.10.1
ip dhcp excluded-address 192.168.11.1
!
ip dhcp pool CLIENT1_POOL
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.10.1
!
ip dhcp pool CLIENT2_POOL
 network 192.168.11.0 255.255.255.0
 default-router 192.168.11.1
 dns-server 192.168.11.1
!
! ---- Authoritative DNS (Sprint 4 §2.4) ----
! "ip dns server" answers DNS queries; "ip host" adds the game server's A
! record. "ip dns primary" makes R1 the primary (SOA) server for the
! kaanta.edu zone, so its answers carry the AA (authoritative) flag. Without
! it, IOS answers from the host table as non-authoritative.
ip domain lookup
ip dns server
ip dns primary kaanta.edu soa R1.kaanta.edu admin.kaanta.edu
ip host server.kaanta.edu 192.168.20.100
!
! ---- Console convenience (not required) ----
! "transport preferred none" stops IOS from treating a mistyped command as a
! hostname to look up in DNS (the "Translating..." pause). Logging
! synchronous keeps log messages from breaking up what you are typing.
line con 0
 exec-timeout 0 0
 logging synchronous
 transport preferred none
line vty 0 4
 transport preferred none
! ---------------------------- cut here ----------------------------
end
