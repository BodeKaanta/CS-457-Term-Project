# Generated by tools/build_cml_lab.py from cml/R1.cfg. Import into CML
# (Dashboard > Import), start the lab, then follow cml/LAB_GUIDE.md.
lab:
  title: CS 457 Pente - Sprint 4 one-router topology
  description: Sprint 4 - one Cisco IOSv router (R1) serving three subnets with DHCP and authoritative DNS for server.kaanta.edu
  notes: |-
    Subnet A 192.168.10.0/24: bk-Client1 (DHCP CLIENT1_POOL), gateway and DNS 192.168.10.1
    Subnet B 192.168.11.0/24: bk-Client2 (DHCP CLIENT2_POOL), gateway and DNS 192.168.11.1
    Subnet C 192.168.20.0/24: bk-Server static 192.168.20.100, gateway 192.168.20.1
    DNS on R1: server.kaanta.edu -> 192.168.20.100
    Console login for the Alpine nodes: cisco / cisco
  version: 0.2.0
nodes:
  - id: n0
    label: bk-R1
    node_definition: iosv
    x: 0
    y: 0
    configuration: |-
      hostname R1
      !
      ! IPv4 forwarding between the three connected subnets (Sprint 4 §2.1).
      ! All three networks are directly connected, so no static routes are needed.
      ip routing
      !
      ! ---- Interfaces (Sprint 4 §2.1) ----
      interface GigabitEthernet0/0
       description unused
       no ip address
       shutdown
      !
      interface GigabitEthernet0/1
       description Subnet A gateway - bk-Client1
       ip address 192.168.10.1 255.255.255.0
       no shutdown
      !
      interface GigabitEthernet0/2
       description Subnet B gateway - bk-Client2
       ip address 192.168.11.1 255.255.255.0
       no shutdown
      !
      interface GigabitEthernet0/3
       description Subnet C gateway - bk-Server (game server)
       ip address 192.168.20.1 255.255.255.0
       no shutdown
      !
      ! ---- DHCP (Sprint 4 §2.3) ----
      ! Never lease the gateway addresses. Client 1 gets 192.168.10.2, Client 2 192.168.11.2.
      ip dhcp excluded-address 192.168.10.1
      ip dhcp excluded-address 192.168.11.1
      !
      ip dhcp pool CLIENT1_POOL
       network 192.168.10.0 255.255.255.0
       default-router 192.168.10.1
       dns-server 192.168.10.1
      !
      ip dhcp pool CLIENT2_POOL
       network 192.168.11.0 255.255.255.0
       default-router 192.168.11.1
       dns-server 192.168.11.1
      !
      ! ---- Authoritative DNS (Sprint 4 §2.4) ----
      ip domain lookup
      ip dns server
      ip host server.kaanta.edu 192.168.20.100
      !
      ! ---- Console convenience (not required) ----
      ! "transport preferred none" stops IOS from treating a mistyped command as a
      ! hostname to look up in DNS (the "Translating..." pause). Logging
      ! synchronous keeps log messages from breaking up what you are typing.
      line con 0
       exec-timeout 0 0
       logging synchronous
       transport preferred none
      line vty 0 4
       transport preferred none
      end
    tags: []
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        slot: 0
        type: physical
      - id: i2
        label: GigabitEthernet0/1
        slot: 1
        type: physical
      - id: i3
        label: GigabitEthernet0/2
        slot: 2
        type: physical
      - id: i4
        label: GigabitEthernet0/3
        slot: 3
        type: physical
  - id: n1
    label: bk-Client1
    node_definition: alpine
    x: 240
    y: -240
    configuration: |-
      # CML runs this shell script as root when the Alpine node boots.
      hostname bk-Client1
      # Console login
      USERNAME=cisco
      PASSWORD=cisco
      # Bring the link up. The IP address, gateway and DNS server come from R1's
      # DHCP pool (CLIENT1_POOL): run "sudo udhcpc -i eth0" at the console (Sprint 4 2.3).
      ip link set eth0 up
    tags: []
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
  - id: n2
    label: bk-Client2
    node_definition: alpine
    x: -240
    y: -240
    configuration: |-
      # CML runs this shell script as root when the Alpine node boots.
      hostname bk-Client2
      # Console login
      USERNAME=cisco
      PASSWORD=cisco
      # Bring the link up. The IP address, gateway and DNS server come from R1's
      # DHCP pool (CLIENT2_POOL): run "sudo udhcpc -i eth0" at the console (Sprint 4 2.3).
      ip link set eth0 up
    tags: []
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
  - id: n3
    label: bk-Server
    node_definition: alpine
    x: 0
    y: 240
    configuration: |-
      # CML runs this shell script as root when the Alpine node boots.
      hostname bk-Server
      # Console login
      USERNAME=cisco
      PASSWORD=cisco
      # Static address and default gateway for the game server (Sprint 4 2.2).
      # Without the default route the server could not answer the other subnets.
      ip link set eth0 up
      ip addr add 192.168.20.100/24 dev eth0
      ip route add default via 192.168.20.1
    tags: []
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
links:
  - id: l0
    n1: n0
    i1: i2
    n2: n1
    i2: i0
    label: bk-R1 Gi0/1 <-> bk-Client1 eth0 (Subnet A 192.168.10.0/24)
  - id: l1
    n1: n0
    i1: i3
    n2: n2
    i2: i0
    label: bk-R1 Gi0/2 <-> bk-Client2 eth0 (Subnet B 192.168.11.0/24)
  - id: l2
    n1: n0
    i1: i4
    n2: n3
    i2: i0
    label: bk-R1 Gi0/3 <-> bk-Server eth0 (Subnet C 192.168.20.0/24)
